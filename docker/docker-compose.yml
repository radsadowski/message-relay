version: "3.9"
services:
  broker:
    image: rabbitmq:3.12.12-management
    restart: always
    ports:
      - 15672:15672
      - 5672:5672
  db:
    image: mysql:8.3
    command: --default-authentication-plugin=caching_sha2_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret123
      MYSQL_USER: admin
      MYSQL_PASSWORD: secret123
      MYSQL_DATABASE: outbox
    ports:
      - 3306:3306
