version: "3.9"
services:
  outbox:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    env_file:
      - ../.env
    ports:
      - 8080:8080
      - 8081:8081
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: curl --fail http://localhost:8080 || exit 1
      interval: 20s
      retries: 5
      start_period: 20s
      timeout: 5s

  broker:
    image: rabbitmq:3.12.12-management
    restart: always
    ports:
      - 15672:15672
      - 5672:5672
  db:
    image: mysql:8.3
    command: --default-authentication-plugin=caching_sha2_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret123
      MYSQL_USER: admin
      MYSQL_PASSWORD: secret123
      MYSQL_DATABASE: outbox
    healthcheck:
      test: mysqladmin ping -u admin -psecret123
      timeout: 20s
      retries: 10
    ports:
      - 3306:3306
    volumes:
      - ./outbox.sql:/docker-entrypoint-initdb.d/outbox.sql
